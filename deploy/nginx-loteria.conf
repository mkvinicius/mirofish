# Nginx servindo o frontend estatico + proxy da API, com senha basica.
# Instalacao (como root), DEPOIS de criar a senha (ver docs/MANUAL-VPS.md):
#   cp /opt/mirofish/deploy/nginx-loteria.conf /etc/nginx/sites-available/mirofish
#   ln -sf /etc/nginx/sites-available/mirofish /etc/nginx/sites-enabled/mirofish
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    # Senha em todo o site (crie com: htpasswd -c /etc/nginx/.htpasswd seuusuario)
    auth_basic "MiroFish Loterias";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Frontend buildado
    root /opt/mirofish/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;   # estudos da Mega levam alguns minutos
    }
}
